name: 草稿預覽／發佈工具（供 Claude 呼叫）

# 讓 Claude 可以：
# - fetch：讀出某篇 WordPress 草稿的完整內容，做成預覽連結給你看
# - publish：你確認內容沒問題後，把該篇草稿改成正式發佈
# 一般不需要自己手動跑這個，但也可以到 Actions 分頁手動觸發。
on:
  workflow_dispatch:
    inputs:
      action:
        description: "要做什麼"
        required: true
        type: choice
        default: "fetch"
        options:
          - fetch
          - publish
          - strip_sources
          - replace_text
          - add_category
          - remove_category
          - move_category
          - list_categories
          - set_title
          - fix_hero_image
          - trash_post
      post_id:
        description: "WordPress 文章 ID"
        required: true
        type: string
      old_text:
        description: "要被取代的原始文字（僅 replace_text 需要）"
        required: false
        type: string
      new_text:
        description: "取代後的新文字（僅 replace_text 需要）"
        required: false
        type: string
      category_name:
        description: "分類名稱（add_category／remove_category／move_category 需要，查無則自動建立）"
        required: false
        type: string
      parent_category_name:
        description: "上層分類名稱（僅 move_category 需要，查無則自動建立）"
        required: false
        type: string
      title:
        description: "新標題（僅 set_title 需要）"
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          OLD_TEXT: ${{ inputs.old_text }}
          NEW_TEXT: ${{ inputs.new_text }}
          CATEGORY_NAME: ${{ inputs.category_name }}
          PARENT_CATEGORY_NAME: ${{ inputs.parent_category_name }}
          TITLE: ${{ inputs.title }}
        run: python draft_tool.py "${{ inputs.action }}" "${{ inputs.post_id }}"
